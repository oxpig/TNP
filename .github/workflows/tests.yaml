name: Tests

# Run on every pull request and push to `main`, and called by `release.yaml`, so
# that no release is made from a commit whose tests fail.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:
    inputs:
      slow:
        description: Also run the slow tests, which model a nanobody end to end.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        # A login shell, so that the Conda environment is activated.
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ANARCI and HMMER come from Bioconda, not PyPI.
      - name: Set up Conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install TNP
        run: pip install --no-deps --editable .

      - name: Lint
        run: ruff check

      - name: Run the tests
        run: pytest ${{ inputs.slow && '--runslow' || '' }}
