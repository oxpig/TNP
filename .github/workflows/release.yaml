name: Release

# Make a GitHub release, with a signed source distribution, for each version
# tag.  The Bioconda recipe builds from the release's source archive, and the
# Bioconda bot picks up new releases automatically.
on:
  push:
    tags: [ "v*" ]

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
    with:
      slow: true

  build:
    name: Build the source distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Build a source tarball
        run: uv build --sdist
      - name: Store the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/

  github-release:
    name: Sign the distribution and make a GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For making GitHub releases.
      id-token: write  # For Sigstore.
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/
      - name: Sign the distribution with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.tar.gz
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
      - name: Upload the distribution and signatures to the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" dist/**
          --repo "$GITHUB_REPOSITORY"
