version: 2

updates:
  # Update the pinned versions in `environment.yml`, from conda-forge and
  # Bioconda, including the `pip` section.
  - package-ecosystem: "conda"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      conda-dependencies:
        patterns: ["*"]
    # Dependabot doesn't solve the Conda environment, so it would propose new
    # Python minor versions that other packages (e.g. FreeSASA) don't support.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
